<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学信档案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 80px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        /* 次级导航栏 */
        .sub-nav {
            background-color: #6BC4B8;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .sub-nav-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 学信档案Logo */
        .logo-icon {
            width: 40px;
            height: 28px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .sub-nav-title {
            color: white;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 3px;
        }

        /* 内容区 */
        .content {
            padding: 16px;
            background-color: #f5f5f5;
        }

        /* 专业推荐卡片 */
        .recommend-card {
            background-color: white;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .recommend-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .recommend-left {
            flex: 1;
        }

        .recommend-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .recommend-title {
            font-size: 19px;
            font-weight: 700;
            color: #333;
        }

        .vote-tag {
            background-color: #FFF8E1;
            color: #FF9800;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .vote-count {
            color: #FF6D00;
            font-weight: 700;
        }

        .recommend-btn {
            background-color: #6BC4B8;
            color: white;
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            margin-top: 4px;
        }

        .school-name {
            font-size: 15px;
            color: #666;
            font-weight: 400;
        }

        /* 多记录展示样式 */
        .records-list {
            margin-top: 10px;
        }

        .record-item {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info {
            flex: 1;
        }

        .record-school {
            font-size: 15px;
            color: #333;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .record-major {
            font-size: 13px;
            color: #666;
        }

        .record-badge {
            background-color: #6BC4B8;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }

        /* 职位卡片 */
        .job-card {
            background-color: #F5F5F5;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .job-info {
            flex: 1;
        }

        .job-title {
            font-size: 19px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .job-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .job-salary {
            color: #FF6D00;
            font-size: 17px;
            font-weight: 700;
        }

        .job-tag {
            background-color: #E8F5E9;
            color: #4CAF50;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }

        .job-btn {
            background-color: #6BC4B8;
            color: white;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }

        /* 考证现状横幅 */
        .exam-banner {
            background: linear-gradient(135deg, #5B9BD5 0%, #4A8BC4 100%);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            min-height: 100px;
        }

        .exam-title {
            color: white;
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .exam-desc {
            color: rgba(255,255,255,0.95);
            font-size: 13px;
            line-height: 1.7;
            max-width: 65%;
            font-weight: 400;
        }

        .exam-deco {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 140px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: 100% 0 0 0;
        }

        /* 功能网格 */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px 16px;
            margin-bottom: 20px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        /* 图标基础样式 */
        .feature-icon-wrap {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        /* 1. 高等教育信息 - 浅绿色背景，绿色图标 */
        .icon-edu {
            background-color: #E8F5E9;
            color: #4CAF50;
            border-radius: 50%;
            font-size: 24px;
        }

        /* 2. 在线验证报告 - 浅绿色背景，绿色盾牌，白色对勾 */
        .icon-verify {
            background-color: #E8F5E9;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 绿色盾牌 */
        .shield-shape {
            width: 24px;
            height: 28px;
            background-color: #4CAF50;
            position: relative;
            clip-path: polygon(50% 0%, 100% 25%, 100% 60%, 50% 100%, 0% 60%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 白色对勾 */
        .check-mark {
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: 2px;
        }

        /* 3. 学历学位认证 - 浅绿色背景，绿色列表图标 */
        .icon-list {
            background-color: #E8F5E9;
            color: #4CAF50;
            border-radius: 10px;
            font-size: 26px;
        }

        /* 4. 出国报告 - 浅蓝色背景，蓝色地球图标 */
        .icon-globe {
            background-color: #E3F2FD;
            color: #2196F3;
            border-radius: 50%;
            font-size: 26px;
        }

        /* 5. 毕业证书校对 - 浅绿色背景，绿色人形图标 */
        .icon-user-check {
            background-color: #E8F5E9;
            color: #4CAF50;
            border-radius: 10px;
            font-size: 26px;
        }

        /* 6. 就业 - 纯绿色背景，白色Offer文字 */
        .icon-offer-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 4px;
        }

        .icon-offer {
            background-color: #4CAF50;
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* 7. 学校满意度 - 浅橙色背景，橙色笑脸 */
        .icon-smile {
            background-color: #FFF3E0;
            color: #FF9800;
            border-radius: 50%;
            font-size: 32px;
        }

        /* 8. 个人测评 - 浅蓝色背景，蓝色剪贴板 */
        .icon-clipboard {
            background-color: #E3F2FD;
            color: #2196F3;
            border-radius: 10px;
            font-size: 26px;
        }

        /* 9. 双千计划 - 纯蓝色背景，白色双千文字 */
        .icon-double-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-double {
            background-color: #2196F3;
            color: white;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1;
        }

        .feature-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            font-weight: 400;
            margin-top: 4px;
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            border-top: 1px solid #E0E0E0;
            display: flex;
            justify-content: space-around;
            padding: 6px 0 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active .nav-icon {
            color: #6BC4B8;
        }

        .nav-item.active .nav-text {
            color: #6BC4B8;
        }

        .nav-icon {
            font-size: 24px;
            color: #999;
            height: 24px;
            display: flex;
            align-items: center;
        }

        .nav-text {
            font-size: 11px;
            color: #999;
            font-weight: 400;
            transform: scale(0.95);
        }

        /* 空状态提示 */
        .empty-tip {
            color: #999;
            font-size: 14px;
            padding: 10px 0;
        }

        .add-data-link {
            color: #6BC4B8;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- 次级导航栏 -->
<div class="sub-nav">
    <div class="sub-nav-content">
        <div class="logo-icon">
            <!-- 使用SVG精确绘制 - 从左往右三页，底部对齐，顶部向左翻起 -->
            <svg width="40" height="28" viewBox="0 0 40 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 第一页（最左侧）- 底部在右，顶部向左翻 -->
                <path d="M12 24 Q10 16 6 8 Q10 10 16 12 Q18 18 20 24 Q16 24 12 24" fill="white"/>

                <!-- 第二页（中间）- 底部在右，顶部向左翻 -->
                <path d="M20 24 Q18 14 14 6 Q20 8 28 10 Q30 18 32 24 Q26 24 20 24" fill="white"/>

                <!-- 第三页（最右侧）- 底部在右，顶部向左翻 -->
                <path d="M30 24 Q28 12 24 4 Q32 6 38 8 Q38 18 38 24 Q34 24 30 24" fill="white"/>
            </svg>
        </div>
        <span class="sub-nav-title">学信档案</span>
    </div>
</div>

<!-- 内容区 -->
<div class="content">

    <!-- 专业推荐 - 动态显示存储的学校和专业信息 -->
    <div class="recommend-card">
        <div class="recommend-header">
            <div class="recommend-left">
                <div class="recommend-title-row">
                    <span class="recommend-title">我的学籍信息</span>
                    <span class="vote-tag">共 <span class="vote-count" id="recordCount">0</span> 条记录</span>
                </div>
                <div id="schoolInfoContainer">
                    <div class="school-name">加载中...</div>
                </div>
            </div>
            <button class="recommend-btn" onclick="window.location.href='xueshengxinxi.html'">去录入</button>
        </div>
    </div>

    <!-- 职位推荐 -->
    <div class="job-card">
        <div class="job-info">
            <div class="job-title">电源FAE</div>
            <div class="job-meta">
                <span class="job-salary">8.0k-13.0k</span>
                <span class="job-tag">本科及以上</span>
            </div>
        </div>
        <button class="job-btn">更多职位</button>
    </div>

    <!-- 考证现状横幅 -->
    <div class="exam-banner">
        <div class="exam-title">考证现状</div>
        <div class="exam-desc">
            参与考证需求调研，分享备考经验，共筑<br>
            高效考证指南
        </div>
        <div class="exam-deco"></div>
    </div>

    <!-- 功能网格 -->
    <div class="feature-grid">
        <!-- 第一行 -->
        <!-- 高等教育信息 - 添加点击跳转 -->
        <div class="feature-item" onclick="window.location.href='xuexinwang.html'">
            <div class="feature-icon-wrap icon-edu">
                <i class="fas fa-user-graduate"></i>
            </div>
            <span class="feature-text">高等教育信息</span>
        </div>

        <!-- 在线验证报告 -->
        <div class="feature-item">
            <div class="icon-verify">
                <div class="shield-shape">
                    <span class="check-mark">✓</span>
                </div>
            </div>
            <span class="feature-text" style="margin-top: 8px;">在线验证报告</span>
        </div>

        <div class="feature-item">
            <div class="feature-icon-wrap icon-list">
                <i class="fas fa-th-list"></i>
            </div>
            <span class="feature-text">学历学位认证<br>与成绩验证</span>
        </div>

        <!-- 第二行 -->
        <div class="feature-item">
            <div class="feature-icon-wrap icon-globe">
                <i class="fas fa-globe-asia"></i>
            </div>
            <span class="feature-text">出国（境）报告<br>发送</span>
        </div>

        <div class="feature-item">
            <div class="feature-icon-wrap icon-user-check">
                <i class="fas fa-user-check"></i>
            </div>
            <span class="feature-text">毕业证书图像<br>校对</span>
        </div>

        <div class="feature-item icon-offer-wrap">
            <div class="icon-offer">Offer</div>
            <span class="feature-text" style="margin-top: 12px;">就业</span>
        </div>

        <!-- 第三行 -->
        <div class="feature-item">
            <div class="feature-icon-wrap icon-smile">
                <i class="fas fa-smile"></i>
            </div>
            <span class="feature-text">学校满意度</span>
        </div>

        <div class="feature-item">
            <div class="feature-icon-wrap icon-clipboard">
                <i class="fas fa-clipboard-check"></i>
            </div>
            <span class="feature-text">个人测评</span>
        </div>

        <div class="feature-item icon-double-wrap">
            <div class="icon-double">双千</div>
            <span class="feature-text" style="margin-top: 8px;">"双千"计划<br>"微专业"</span>
        </div>
    </div>

</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item active">
        <div class="nav-icon">
            <i class="fas fa-home"></i>
        </div>
        <span class="nav-text">首页</span>
    </div>
    <div class="nav-item">
        <div class="nav-icon">
            <i class="fas fa-graduation-cap"></i>
        </div>
        <span class="nav-text">学籍学历学位</span>
    </div>
    <div class="nav-item">
        <div class="nav-icon">
            <i class="fas fa-clipboard-check"></i>
        </div>
        <span class="nav-text">个人测评</span>
    </div>
    <div class="nav-item">
        <div class="nav-icon">
            <i class="fas fa-briefcase"></i>
        </div>
        <span class="nav-text">求职招聘</span>
    </div>
    <!-- 我的 - 添加点击跳转 -->
    <div class="nav-item" onclick="window.location.href='xueshengxinxi.html'">
        <div class="nav-icon">
            <i class="fas fa-user"></i>
        </div>
        <span class="nav-text">我的</span>
    </div>
</div>

<script>
    // 页面加载时读取并显示学生信息
    window.onload = function() {
        loadStudentInfo();
    };

    // 从localStorage读取学生信息并显示
    function loadStudentInfo() {
        const STORAGE_KEY = 'studentRecords';
        const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const container = document.getElementById('schoolInfoContainer');
        const countSpan = document.getElementById('recordCount');

        countSpan.textContent = records.length;

        if (records.length === 0) {
            // 没有数据时显示提示
            container.innerHTML = `
                <div class="empty-tip">
                    暂无学籍信息，<a href="xueshengxinxi.html" class="add-data-link">点击录入</a>
                </div>
            `;
            return;
        }

        // 有数据时显示列表
        let html = '<div class="records-list">';

        // 最多显示3条记录，避免卡片过长
        const displayRecords = records.slice(0, 3);

        displayRecords.forEach((record, index) => {
            const schoolInfo = `${record.college || '未知学院'}-${record.department || '未知院系'}`;
            const majorInfo = `${record.major || '未知专业'}（${record.className || '未知班级'}）`;

            html += `
                <div class="record-item">
                    <div class="record-info">
                        <div class="record-school">
                            ${schoolInfo}
                            ${index === 0 ? '<span class="record-badge">最新</span>' : ''}
                        </div>
                        <div class="record-major">${majorInfo}</div>
                    </div>
                </div>
            `;
        });

        // 如果记录超过3条，显示"查看更多"
        if (records.length > 3) {
            html += `
                <div class="record-item" style="justify-content: center; padding-top: 12px;">
                    <a href="xueshengxinxi.html" style="color: #6BC4B8; font-size: 13px; text-decoration: none;">
                        查看全部 ${records.length} 条记录 <i class="fas fa-chevron-right" style="font-size: 10px;"></i>
                    </a>
                </div>
            `;
        }

        html += '</div>';
        container.innerHTML = html;
    }
</script>

</body>
</html>
